name: Build PixelOS 17 d2x

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free Disk Space & Setup Swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo apt-get clean
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Sync PixelOS 17 & d2x Trees
        run: |
          mkdir -p ~/bin ~/pixelos
          curl https://googleapis.com > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          git config --global user.name "bungtt5"
          git config --global user.email "bungtt5@://github.com"
          cd ~/pixelos
          repo init -u https://github.com -b seventeen --git-lfs --depth=1
          git clone https://github.com .repo/local_manifests
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch

      - name: Build PixelOS
        run: |
          cd ~/pixelos
          source build/envsetup.sh
          lunch custom_d2x-userdebug
          m pixelos -j$(nproc --all)

      - name: Upload Output to PixelDrain
        if: always()
        run: |
          ROM_ZIP=$(find ~/pixelos/out/target/product/d2x -maxdepth 1 -name "PixelOS*.zip" | head -n 1)
          if [ -f "$ROM_ZIP" ]; then
            curl -T "$ROM_ZIP" https://pixeldrain.com
          else
            echo "No ROM zip generated yet."
          fi
